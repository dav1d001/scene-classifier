version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    # Scale this service for the Locust flood-test comparison, e.g.:
    #   docker compose up --scale api=3
    # (drop the fixed host port above to "8000-8010:8000" range if scaling >1)

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
